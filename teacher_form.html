<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SENSE 儿童感官评定表</title>
  <!-- Teacher-rated sensory reference (paper §Teacher-Rated Sensory Reference;
       content = SENSE/paper/_design_notes/teacher_sensory_scale_v2_20261008.md).
       One question per screen. Self-contained: system fonts only (Google is
       blocked in China), no offline.js. Saves through /api/save-session as
       condition "teacherform", then hands off to the slider video (role=teacher).
       Opened with the teacher token (server.py TEACHER_TOKEN). -->
  <style>
    :root {
      --bg: #fafaf8; --card: #fff; --ink: #2c2c2c; --muted: #7a7a74; --line: #e4e2dc;
      --accent: #c9a24a; --accent-ink: #4a3d1c; --accent-soft: #fff8ec; --warn: #d9534f;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Helvetica Neue', sans-serif;
      background: var(--bg); color: var(--ink); line-height: 1.6;
    }
    .app { max-width: 600px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; padding: 0 16px; }
    .top { padding: 0.9rem 0 0.6rem; }
    .top-row { display: flex; justify-content: space-between; align-items: center; font-size: 0.8rem; color: var(--muted); margin-bottom: 0.4rem; }
    .bar { height: 6px; background: #ebe8e0; border-radius: 3px; overflow: hidden; }
    .bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width 0.25s; }
    .top.hidden { visibility: hidden; }
    main { flex: 1; padding: 0.6rem 0 1rem; }
    .screen { display: none; animation: in 0.2s ease-out; }
    .screen.active { display: block; }
    @keyframes in { from { opacity: 0; transform: translateX(12px); } to { opacity: 1; transform: none; } }
    h1 { font-size: 1.45rem; margin: 0.8rem 0 0.3rem; }
    .lead { color: var(--muted); font-size: 0.9rem; margin-bottom: 1rem; }
    .intro { background: var(--accent-soft); border: 1px solid #f0dfb8; border-radius: 14px; padding: 1rem; color: #5a4a22; font-size: 0.92rem; }
    .intro p + p, .intro ul { margin-top: 0.6rem; }
    .intro ul { padding-left: 1.2rem; }
    .intro b { color: var(--accent-ink); }
    .ctx { display: inline-flex; align-items: baseline; gap: 0.4rem; background: var(--accent-soft); border: 1px solid #f0dfb8;
      color: var(--accent-ink); border-radius: 999px; padding: 0.15rem 0.75rem; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.3rem; }
    .ctx small { font-weight: 400; color: #8a7a52; }
    .q-label { font-weight: 700; font-size: 1.15rem; margin: 0.5rem 0 0.2rem; }
    .q-hint { color: var(--muted); font-size: 0.88rem; margin-bottom: 0.4rem; }
    .opt-tag { color: var(--muted); font-size: 0.85rem; font-weight: 400; }
    .anchors { font-size: 0.9rem; margin: 0.6rem 0 1rem; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 0.6rem 0.8rem; }
    .anchors div { display: flex; gap: 0.6rem; padding: 0.25rem 0; }
    .anchors .n { flex: 0 0 1.6rem; height: 1.6rem; border-radius: 50%; background: #f1efe9; text-align: center; font-weight: 700; font-size: 0.85rem; line-height: 1.6rem; }
    .scale { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
    .scale-ends { display: flex; justify-content: space-between; font-size: 0.8rem; color: var(--muted); margin-top: 0.3rem; }
    .opts { display: flex; flex-direction: column; gap: 10px; margin-top: 0.8rem; }
    .opt { position: relative; display: block; }
    .opt input { position: absolute; opacity: 0; pointer-events: none; }
    .opt span { display: block; min-height: 48px; padding: 0.7rem 1rem; border: 1.5px solid var(--line); border-radius: 12px;
      background: #fff; font-size: 1rem; cursor: pointer; user-select: none; -webkit-tap-highlight-color: transparent; }
    .scale .opt span { padding: 0.7rem 0; text-align: center; font-weight: 700; font-size: 1.05rem; }
    .opt input:checked + span { border-color: var(--accent); background: var(--accent); color: #fff; }
    .opt input:focus-visible + span { outline: 3px solid rgba(201,162,74,0.4); }
    .na { margin-top: 12px; }
    .na span { font-size: 0.92rem; }
    input[type=text], textarea { width: 100%; padding: 0.8rem 0.9rem; font-size: 1.05rem; font-family: inherit;
      border: 1.5px solid var(--line); border-radius: 12px; background: #fff; color: var(--ink); margin-top: 0.8rem; }
    textarea { min-height: 8rem; resize: vertical; }
    .extra { margin-top: 0.4rem; }
    .extra[hidden] { display: none; }
    .nav { position: sticky; bottom: 0; background: var(--bg); padding: 0.7rem 0 calc(0.9rem + env(safe-area-inset-bottom)); display: flex; gap: 10px; }
    .nav button { min-height: 52px; border-radius: 12px; font-size: 1.02rem; font-weight: 700; font-family: inherit; cursor: pointer; }
    .back { flex: 0 0 34%; background: #fff; border: 1.5px solid var(--line); color: var(--ink); }
    .next { flex: 1; background: var(--accent); border: none; color: #fff; }
    .next:disabled { opacity: 0.4; cursor: default; }
    .back[hidden], .nav[hidden] { display: none; }
    .msg { font-size: 0.9rem; min-height: 1.2em; margin-top: 0.6rem; }
    .msg.err { color: var(--warn); }
    .done h2 { font-size: 1.3rem; margin: 0.8rem 0 0.5rem; }
    .done ol { padding-left: 1.2rem; font-size: 0.95rem; margin: 0.6rem 0 1.2rem; }
    .go { display: block; text-align: center; text-decoration: none; min-height: 52px; line-height: 52px;
      border-radius: 12px; background: var(--accent); color: #fff; font-weight: 700; font-size: 1.05rem; }
    .small { font-size: 0.84rem; color: var(--muted); margin-top: 0.9rem; }
  </style>
</head>
<body>
<div class="app">
  <div class="top hidden" id="top">
    <div class="top-row"><span id="section"></span><span id="count"></span></div>
    <div class="bar"><i id="bar"></i></div>
  </div>
  <main>
    <form id="form" novalidate autocomplete="off"></form>
    <div class="screen done" id="done">
      <h2>评定表已提交 ✓</h2>
      <p>最后一步：边看一段准备视频，边把画面、声音、距离、节奏调到最适合这个孩子的样子。</p>
      <ol>
        <li>请<b>打开声音</b>（最好戴耳机）；手机请<b>横屏</b>，用电脑或平板更方便</li>
        <li>点视频右下角的 ⚙️ 齿轮，打开"调节"面板</li>
        <li>逐个调 8 个滑块（中间位置 = 一般孩子的默认值），调整会马上反映在视频上，可以边播边调</li>
        <li>想象这个孩子在看这段视频：调到他/她<b>看着舒服、又能看进去</b>的样子</li>
        <li>调好后点 <b>确认设置</b>，看到"已保存 ✓"就全部完成了</li>
      </ol>
      <a class="go" id="go" href="teacher.html">开始调视频 →</a>
      <p class="small">如果现在不方便，也可以稍后再打开本页面（同一个手机/电脑），会直接回到这一步。</p>
    </div>
  </main>
  <div class="nav" id="nav">
    <button type="button" class="back" id="back">上一题</button>
    <button type="button" class="next" id="next">下一题</button>
  </div>
  <div class="msg" id="msg"></div>
</div>

<script>
// ---- Content (v2 scale, plain-language wording for teachers) -------------
const SENSES = [
  { id: 'volume', title: '声音大小', sub: '说话声、电视声、突然的大声',
    th: ['日常音量（说话声、电视声）就会不适或有明显反应', '日常音量没问题；突然的大声会愣一下，很快恢复', '很大的声音才会注意到，叫名字常常没反应'],
    st: ['被动：不采取行动——默默忍受、烦躁、注意力被打乱（敏感时）；或没注意到声音（不敏感时）', '有时主动、有时被动，看情况', '主动：采取行动改变声音——捂耳、离开、要求关小（敏感时）；或凑近音源、把声音开大、自己制造响声（不敏感时）'] },
  { id: 'pitch', title: '声音尖细', sub: '口哨、警报、尖叫等高音调的声音',
    th: ['尖细的高音即使不大声也会明显不适', '各种音调都能接受；很尖的声音偶尔愣一下，很快恢复', '尖锐的高音也不太会注意到'],
    st: ['被动：听到尖细声音时紧张、烦躁但不做什么（敏感时）；或对尖细声音没有反应（不敏感时）', '有时主动、有时被动，看情况', '主动：捂耳、躲开、让别人停下（敏感时）；或喜欢、反复发出尖叫和高音（不敏感时）'] },
  { id: 'brightness', title: '光线明暗', sub: '室内灯光、户外日光、突然的强光',
    th: ['常规室内光或户外日光就会不适', '常规光线没问题；突然的强光会眯一下眼，很快适应', '很强的光也不太在意'],
    st: ['被动：揉眼、烦躁、难以专注，但不做什么（敏感时）；或对光线变化没反应（不敏感时）', '有时主动、有时被动，看情况', '主动：眯眼、捂眼、背过脸、要求关灯（敏感时）；或盯着灯和反光物看、找亮的地方待（不敏感时）'] },
  { id: 'saturation', title: '颜色鲜艳程度', sub: '鲜艳、浓烈的颜色或画面',
    th: ['鲜艳、浓烈的颜色或画面就会让孩子不适', '日常色彩都能接受，没有明显的偏好或回避', '对颜色差异不太注意'],
    st: ['被动：看久了烦躁、分心，但不做什么（敏感时）；或对颜色没什么反应（不敏感时）', '有时主动、有时被动，看情况', '主动：别开脸、拒绝看、遮住画面（敏感时）；或反复寻找、凝视鲜艳的东西（不敏感时）'] },
  { id: 'proximity', title: '别人靠近', sub: '别人靠近或碰到孩子的身体',
    th: ['别人靠近（还没碰到）就会不适', '一般社交距离没问题；陌生人突然靠很近会躲一下', '别人靠近或碰到也很少注意'],
    st: ['被动：身体僵住、紧张，但不躲开（敏感时）；或对别人靠近没有反应（不敏感时）', '有时主动、有时被动，看情况', '主动：后退、推开、躲开（敏感时）；或主动贴近别人，喜欢挤、抱、贴着（不敏感时）'] },
  { id: 'pacing', title: '节奏快慢', sub: '说话快、画面切换快、活动推进快',
    th: ['稍快的节奏就会不适', '一般节奏都能跟上；特别快的时候有点乱，很快调整过来', '节奏很快也不受影响'],
    st: ['被动：烦躁、紧张、跟不上，但不做什么（敏感时）；或节奏变化时没什么反应（不敏感时）', '有时主动、有时被动，看情况', '主动：要求停下、离开、捂眼（敏感时）；或主动要求更快、偏爱快速切换的动画和游戏（不敏感时）'] },
];
const BASIC = [
  { id: 'pid', label: '孩子姓名', hint: '请填孩子的全名', type: 'text' },
  { id: 'teacher_name', label: '您的姓名', type: 'text' },
  { id: 'teacher_role', label: '您的职务', type: 'choice', opts: ['带班老师', '特教老师', '康复治疗师（OT / 言语 / 行为等）', '其他'] },
  { id: 'teacher_role_other', label: '职务（其他）', type: 'text', optional: true, showIf: ['teacher_role', '其他'] },
  { id: 'known_duration', label: '您认识这个孩子多长时间了？', type: 'choice', opts: ['不到 3 个月', '3–6 个月', '6–12 个月', '1 年以上'] },
  { id: 'weekly_contact', label: '您平时每周和这个孩子相处大约多长时间？', type: 'choice', opts: ['少于 2 小时', '2–5 小时', '5–10 小时', '10 小时以上'] },
];


// ---- Screens: one question each ---------------------------------------------
// Each screen: { key (form field name or null), section, html, required, extra }
// `extra` = an inline follow-up field revealed by one answer (role "其他",
// stability "会随场合变化"); such answers don't auto-advance.
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const radio = (name, value, label, cls = '') =>
  `<label class="opt ${cls}"><input type="radio" name="${name}" value="${esc(value)}"><span>${esc(label)}</span></label>`;
const anchors = arr => `<div class="anchors">${[1, 4, 7].map((n, i) => `<div><span class="n">${n}</span><span>${esc(arr[i])}</span></div>`).join('')}</div>`;
const scale = (name, lo, hi) =>
  `<div class="scale">${[1, 2, 3, 4, 5, 6, 7].map(n => radio(name, n, n)).join('')}</div>
   <div class="scale-ends"><span>${lo}</span><span>${hi}</span></div>`;
const label = (t, optional) => `<div class="q-label">${esc(t)}${optional ? ' <span class="opt-tag">（选填）</span>' : ''}</div>`;

const SCREENS = [];
SCREENS.push({ key: null, intro: true, html: `
  <h1>儿童感官评定表</h1>
  <p class="lead">SENSE 研究 · 请孩子的老师填写 · 约 10 分钟 + 调视频 5–10 分钟</p>
  <div class="intro">
    <p>老师您好！感谢您参与 SENSE 研究。</p>
    <p>SENSE 是一个帮学前儿童提前熟悉新场景（如看牙、超市、餐厅）的研究工具。请您根据<b>平时对这个孩子的观察</b>，评一评孩子对 6 种感官刺激的反应。您的评分将作为研究的参照，和其他方式得到的结果做比较。没有对错，按您的印象填写即可。</p>
    <p>每种刺激有两道主要的 1–7 分题：</p>
    <ul>
      <li><b>反应阈值</b>：孩子对这种刺激有多敏感。1 = 很敏感（一点点刺激就有反应），7 = 很不敏感（刺激很强才注意到）。</li>
      <li><b>应对方式</b>：孩子会不会主动做些什么。1 = 被动（忍着，或者没注意到），7 = 主动（想办法躲开、减少，或者去找、去增加）。如果孩子的反应很普通、看不出明显的应对方式，请选"不适用"。</li>
    </ul>
    <p>这两道题分开判断：比如同样是很敏感的孩子，有的会捂耳朵跑开（主动），有的会默默忍着（被动）。</p>
    <p>填完后还有最后一步：边看一段视频边调画面和声音（约 5–10 分钟）。请不要和孩子家长讨论评分内容。填写的信息仅用于研究，不会公开。</p>
  </div>` });

const BASIC_SECTION = '基本信息';
BASIC.filter(f => !f.showIf).forEach(f => {
  if (f.type === 'text') {
    SCREENS.push({ key: f.id, section: BASIC_SECTION, required: !f.optional, html:
      label(f.label, f.optional) + (f.hint ? `<div class="q-hint">${esc(f.hint)}</div>` : '') +
      `<input type="text" name="${f.id}">` });
  } else {
    const other = BASIC.find(g => g.showIf && g.showIf[0] === f.id);
    SCREENS.push({ key: f.id, section: BASIC_SECTION, required: true,
      extra: other ? { when: other.showIf[1], key: other.id } : null, html:
      label(f.label) + `<div class="opts">${f.opts.map(o => radio(f.id, o, o)).join('')}</div>` +
      (other ? `<div class="extra" data-extra="${other.id}" hidden><input type="text" name="${other.id}" placeholder="请说明"></div>` : '') });
  }
});

SENSES.forEach((s, i) => {
  const ctx = `<div class="ctx">${'①②③④⑤⑥'[i]} ${esc(s.title)} <small>${esc(s.sub)}</small></div>`;
  const section = `${'①②③④⑤⑥'[i]} ${s.title}`;
  SCREENS.push({ key: `${s.id}_threshold`, section, required: true, html: ctx +
    label(`反应阈值：孩子对${s.title}有多敏感？`) + anchors(s.th) + scale(`${s.id}_threshold`, '1 很敏感', '7 很不敏感') });
  SCREENS.push({ key: `${s.id}_strategy`, section, required: true, html: ctx +
    label('应对方式：孩子会不会主动做些什么？') + anchors(s.st) + scale(`${s.id}_strategy`, '1 被动', '7 主动') +
    radio(`${s.id}_strategy`, 'NA', '不适用（孩子的反应很普通，看不出明显的应对方式）', 'na') });
  SCREENS.push({ key: `${s.id}_confidence`, section, required: true, html: ctx +
    label(`您对刚才"${s.title}"两题（敏感程度、应对方式）的判断有多大把握？`) +
    `<div class="opts">${[
      ['5', '很有把握'],
      ['4', '比较有把握'],
      ['3', '一般'],
      ['2', '不太有把握'],
      ['1', '很没有把握'],
    ].map(([v, t]) => radio(`${s.id}_confidence`, v, t)).join('')}</div>` });
  SCREENS.push({ key: `${s.id}_stability`, section, required: true,
    extra: { when: 'varies', key: `${s.id}_stability_note` }, html: ctx +
    label(`孩子对${s.title}的反应，在不同场合是否一样？`) +
    `<div class="opts">${radio(`${s.id}_stability`, 'stable', '基本一样')}${radio(`${s.id}_stability`, 'varies', '会随场合变化')}</div>` +
    `<div class="extra" data-extra="${s.id}_stability_note" hidden><input type="text" name="${s.id}_stability_note" placeholder="在什么场合、怎么变化？（选填）"></div>` });
});

SCREENS.push({ key: 'comments', section: '最后', required: false, last: true, html:
  label('还有您觉得重要的其他情况吗？', true) + '<textarea name="comments"></textarea>' });

const form = document.getElementById('form');
form.innerHTML = SCREENS.map((sc, i) => `<section class="screen" data-i="${i}">${sc.html}</section>`).join('');
const screenEls = [...form.querySelectorAll('.screen')];
const QUESTIONS = SCREENS.filter(sc => sc.key).length;

// ---- State ------------------------------------------------------------------
const DRAFT = 'sense_teacherform_draft';
const DONE = 'sense_teacherform_done';
const ls = {
  get(k) { try { return localStorage.getItem(k); } catch (_) { return null; } },
  set(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (_) {} },
};
const values = () => Object.fromEntries(new FormData(form).entries());
const answered = (sc, v = values()) => !sc.required || (v[sc.key] || '').trim() !== '';
let cur = 0;

const $ = id => document.getElementById(id);
const msg = $('msg');
function syncExtras(v = values()) {
  SCREENS.forEach(sc => {
    if (!sc.extra) return;
    const el = form.querySelector(`[data-extra="${sc.extra.key}"]`);
    if (el) el.hidden = v[sc.key] !== sc.extra.when;
  });
}
function render() {
  const sc = SCREENS[cur];
  screenEls.forEach((el, i) => el.classList.toggle('active', i === cur));
  const qNum = SCREENS.slice(0, cur + 1).filter(s => s.key).length;
  $('top').classList.toggle('hidden', !!sc.intro);
  $('section').textContent = sc.section || '';
  $('count').textContent = sc.key ? `第 ${qNum} / ${QUESTIONS} 题` : '';
  $('bar').style.width = (100 * (qNum - (sc.key ? 1 : 0)) / QUESTIONS) + '%';
  $('back').hidden = cur === 0;
  $('next').textContent = sc.intro ? '开始填写' : sc.last ? '提交，进入最后一步' : '下一题';
  $('next').disabled = !answered(sc);
  msg.textContent = ''; msg.className = 'msg';
  window.scrollTo(0, 0);
  const t = screenEls[cur].querySelector('input[type=text]:not([data-extra] input), textarea');
  if (t && !t.value) setTimeout(() => t.focus({ preventScroll: true }), 220);
}
const saveDraft = (v = values()) => ls.set(DRAFT, JSON.stringify({ v, cur }));
function go(i) { cur = Math.max(0, Math.min(SCREENS.length - 1, i)); saveDraft(); render(); }

let advanceTimer = null;
form.addEventListener('input', e => {
  const v = values();
  syncExtras(v);
  saveDraft(v);
  const sc = SCREENS[cur];
  $('next').disabled = !answered(sc, v);
  // Single-choice answer → move on by itself, unless it opened a follow-up field.
  if (e.target.type === 'radio' && e.target.name === sc.key) {
    clearTimeout(advanceTimer);
    if (sc.extra && v[sc.key] === sc.extra.when) return;
    advanceTimer = setTimeout(() => { if (SCREENS[cur] === sc && !sc.last) go(cur + 1); }, 280);
  }
});
form.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.tagName === 'INPUT') { e.preventDefault(); if (!$('next').disabled) $('next').click(); }
});
$('back').addEventListener('click', () => { clearTimeout(advanceTimer); go(cur - 1); });
$('next').addEventListener('click', () => {
  clearTimeout(advanceTimer);
  if (SCREENS[cur].last) submit(); else go(cur + 1);
});

function restore() {
  let d; try { d = JSON.parse(ls.get(DRAFT) || 'null'); } catch (_) { d = null; }
  const urlPid = (new URLSearchParams(location.search).get('pid') || '').trim().replace(/\s+/g, '');
  // A draft for a different child must not leak into this child's form.
  if (urlPid && d && d.v && d.v.pid && d.v.pid.replace(/\s+/g, '') !== urlPid) d = null;
  const v = (d && d.v) || {};
  if (urlPid) v.pid = urlPid;
  for (const [k, val] of Object.entries(v)) {
    form.querySelectorAll(`[name="${k}"]`).forEach(el => {
      if (el.type === 'radio') el.checked = el.value === val; else el.value = val;
    });
  }
  syncExtras();
  // Resume at the first unanswered question (never past where they were).
  if (d && d.cur) {
    const firstGap = SCREENS.findIndex(sc => sc.key && !answered(sc));
    cur = firstGap === -1 ? d.cur : Math.min(d.cur, firstGap);
  }
}

// ---- Submit -----------------------------------------------------------------
function showDone(pid) {
  screenEls.forEach(el => el.classList.remove('active'));
  $('top').classList.add('hidden');
  $('nav').hidden = true;
  $('done').classList.add('active');
  $('go').href = 'index.html?dev=video-dental&pid=' + encodeURIComponent(pid) + '&role=teacher&nocache=1';
  window.scrollTo(0, 0);
}

async function submit() {
  const v = values();
  const gap = SCREENS.findIndex(sc => sc.key && !answered(sc, v));
  if (gap !== -1) { go(gap); msg.className = 'msg err'; msg.textContent = '这一题还没有填'; return; }
  const pid = v.pid.trim().replace(/\s+/g, '');
  const answers = {};
  for (const [k, val] of Object.entries(v)) answers[k] = typeof val === 'string' ? val.trim() : val;
  if (answers.teacher_role !== '其他') delete answers.teacher_role_other;
  answers.pid = pid;
  SENSES.forEach(s => {
    if (answers[`${s.id}_stability`] !== 'varies') delete answers[`${s.id}_stability_note`];
    answers[`${s.id}_threshold`] = Number(answers[`${s.id}_threshold`]);
    answers[`${s.id}_strategy_na`] = answers[`${s.id}_strategy`] === 'NA';
    answers[`${s.id}_strategy`] = answers[`${s.id}_strategy_na`] ? null : Number(answers[`${s.id}_strategy`]);
  });
  const record = {
    sessionId: String(Date.now()),
    participantId: pid,
    condition: 'teacherform',
    exportStage: 'form',
    timestamp: new Date().toISOString(),
    instrument: 'teacher_sensory_scale_v2_20261008',
    userAgent: navigator.userAgent,
    answers,
  };
  const btn = $('next');
  btn.disabled = true; msg.className = 'msg'; msg.textContent = '正在提交…';
  try {
    const r = await fetch('/api/save-session', {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(record),
    });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    ls.set(DRAFT, null);
    ls.set(DONE, pid);
    showDone(pid);
  } catch (err) {
    btn.disabled = false;
    msg.className = 'msg err';
    msg.textContent = '提交没有成功（' + err.message + '），请检查网络后再点一次。您填的内容已保存在本机，不会丢。';
  }
}

// ---- Start ------------------------------------------------------------------
// Already submitted on this device → straight to the video step, unless the
// link is for another child (?pid=…) or ?new=1.
const urlQ = new URLSearchParams(location.search);
const doneFor = ls.get(DONE);
const urlPid = (urlQ.get('pid') || '').trim().replace(/\s+/g, '');
if (urlQ.get('new') === '1' || (urlPid && urlPid !== doneFor)) ls.set(DONE, null);
restore();
if (ls.get(DONE) && doneFor) showDone(doneFor); else render();
</script>
</body>
